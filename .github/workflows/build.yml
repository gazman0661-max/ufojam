name: Build Android

# Çıktılar (Actions > çalışan koşu > Artifacts):
#   - ufo-bus-jam-debug-apk : app-debug.apk   (debug anahtarıyla imzalı, telefona kurulup denenir)
#   - ufo-bus-jam-aab-unsigned : app-release.aab (İMZASIZ; jarsigner ile bilgisayarda imzalanır)
# Bu dosya hiçbir gizli bilgi kullanmaz; imzalama tamamen elle yapılır.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # Actions sekmesinden elle "Run workflow"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketleri indir
        run: flutter pub get

      - name: Debug APK
        run: flutter build apk --debug

      - name: İmzasız AAB (release)
        run: flutter build appbundle --release

      - name: AAB gerçekten imzasız mı? (bilgi amaçlı)
        run: jarsigner -verify build/app/outputs/bundle/release/app-release.aab || true

      - name: Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ufo-bus-jam-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: İmzasız AAB yükle
        uses: actions/upload-artifact@v4
        with:
          name: ufo-bus-jam-aab-unsigned
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
